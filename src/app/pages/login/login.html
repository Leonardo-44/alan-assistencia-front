<div class="login-screen">

  <aside class="brand-panel">
    <div class="brand-panel-glow"></div>

    <div class="brand-content">
      <div class="brand-mark">
        <span class="brand-mark-dot"></span>
        Allan Assistência
      </div>

      <h1 class="brand-title">
        Gestão completa da<br />sua assistência técnica.
      </h1>

      <p class="brand-subtitle">
        Ordens de serviço, clientes, vendas e financeiro em um único painel.
      </p>
    </div>

    <div class="diagnostic-readout">
      <div class="diagnostic-line">
        <span class="diagnostic-dot"></span>
        <span class="mono">{{ diagnosticSteps[currentStep()] }}</span>
      </div>
    </div>
  </aside>

  <main class="form-panel">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Entrar</h2>
        <p>Acesse o painel administrativo</p>
      </div>

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="field">
          <label for="username">Usuário</label>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            placeholder="seu.usuario"
            [disabled]="loading()"
          />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [disabled]="loading()"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >
              @if (showPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
        </div>

        @if (errorMsg()) {
          <div class="error-banner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ errorMsg() }}
          </div>
        }

        <button type="submit" class="submit-btn" [disabled]="loading()">
          @if (loading()) {
            <span class="btn-spinner"></span>
            Entrando...
          } @else {
            Entrar
          }
        </button>
      </form>
    </div>

    <p class="footer-note">Acesso restrito à administração da loja.</p>
  </main>

</div>
