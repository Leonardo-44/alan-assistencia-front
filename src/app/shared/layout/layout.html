<div class="layout" [class.menu-aberto]="menuAberto">

  <aside class="sidebar" [class.aberta]="menuAberto">
    <div class="marca">
      <span class="marca-icone">A</span>
      <div class="marca-texto">
        <strong>Allan Imports</strong>
        <span>Assistência técnica</span>
      </div>
    </div>

    <nav class="nav">
      <span class="nav-secao">Geral</span>

      <a
        routerLink="/dashboard"
        routerLinkActive="ativo"
        (click)="fecharMenu()"
        class="nav-item"
      >
        <span class="nav-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="9" rx="1.5"/>
            <rect x="14" y="3" width="7" height="5" rx="1.5"/>
            <rect x="14" y="12" width="7" height="9" rx="1.5"/>
            <rect x="3" y="16" width="7" height="5" rx="1.5"/>
          </svg>
        </span>
        Dashboard
      </a>

      <a
        routerLink="/clientes"
        routerLinkActive="ativo"
        (click)="fecharMenu()"
        class="nav-item"
      >
        <span class="nav-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/>
          </svg>
        </span>
        Clientes
      </a>

      <a
        routerLink="/ordens-servico"
        routerLinkActive="ativo"
        (click)="fecharMenu()"
        class="nav-item"
      >
        <span class="nav-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5Z"/>
            <path d="M14 3.5V8h4"/>
            <path d="M8.5 12.5h6M8.5 15.5h4"/>
          </svg>
        </span>
        Ordens de Serviço
      </a>

      <a
        routerLink="/vendas"
        routerLinkActive="ativo"
        (click)="fecharMenu()"
        class="nav-item"
      >
        <span class="nav-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3.5 6.5h17l-1.6 9.3a2 2 0 0 1-2 1.7H7.1a2 2 0 0 1-2-1.7L3.5 6.5Z"/>
            <path d="M8 6.5V5a4 4 0 0 1 8 0v1.5"/>
          </svg>
        </span>
        Vendas
      </a>

      <a
        routerLink="/financeiro"
        routerLinkActive="ativo"
        (click)="fecharMenu()"
        class="nav-item"
      >
        <span class="nav-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 7.5v9M15 9.8c0-1.3-1.3-2.3-3-2.3s-3 .9-3 2.2c0 3 6 1.5 6 4.5 0 1.3-1.3 2.3-3 2.3s-3-1-3-2.3"/>
          </svg>
        </span>
        Financeiro
      </a>
    </nav>
  </aside>

  <div
    class="overlay"
    *ngIf="menuAberto"
    (click)="fecharMenu()"
  ></div>

  <div class="area-principal">
    <header class="topbar">
      <button
        class="menu-toggle"
        (click)="alternarMenu()"
        aria-label="Abrir menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
        </svg>
      </button>

      <div class="topbar-titulo">
        <span>Allan Imports</span>
      </div>

      <div class="topbar-usuario">
        <span class="avatar">A</span>
      </div>
    </header>

    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
